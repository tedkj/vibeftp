[package]
name = "vibeftp-core"
version = "0.2.0-preview"
description = "VibeFTP's engine: FTP/FTPS/SFTP, connection pools, transfers, edit copies, sites and pins. No UI."
authors = ["Ted K. Johansen"]
license = "AGPL-3.0-only"
repository = "https://github.com/tedkj/vibeftp"
edition = "2024"

[lib]
name = "vibeftp_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
thiserror = "2.0.21"
russh = "0.64.1"
russh-sftp = "3.0.1"
keyring = { version = "4.2.0", features = ["windows-native-keyring-store", "apple-native-keyring-store", "zbus-secret-service-keyring-store"] }
suppaftp = { version = "12.2.1", features = ["rustls-aws-lc-rs"] }
webpki-roots = "1.0.9"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
log = { version = "0.4", features = ["std"] }

# Windows' own rating of a file type before a remote file goes to its default app
# (AssocIsDangerous, review SNA2).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }

[dev-dependencies]
# A keychain in memory for the tests (never the real Credential Manager).
keyring-core = "1.0.1"
